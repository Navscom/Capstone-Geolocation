<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Smart Tourism AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2>Tourist Registration</h2>
        <p style="font-size: 0.8rem; color: #666;">Create an account to report crowds and danger zones.</p>
        
        <input id="reg_username" placeholder="Choose Username" required>
        <input id="reg_password" type="password" placeholder="Create Password" required>
        
        <button onclick="register()" style="background: #28a745;">Complete Registration</button>
        
        <p style="margin-top: 15px;">Already registered? <a href="login.html">Login here</a></p>
        <br>
        <a href="index.html" style="font-size: 0.8rem; color: #777;">← Back to Dashboard</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
